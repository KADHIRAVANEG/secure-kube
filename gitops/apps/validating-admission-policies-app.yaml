apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securekube-validating-admission-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: securekube

  source:
    repoURL: https://github.com/KADHIRAVANEG/secure-kube
    targetRevision: main
    path: kustomize/base/vap

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

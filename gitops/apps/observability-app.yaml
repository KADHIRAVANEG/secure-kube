apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securekube-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: securekube
  source:
    repoURL: https://github.com/PLACEHOLDER/securekube
    targetRevision: HEAD
    path: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

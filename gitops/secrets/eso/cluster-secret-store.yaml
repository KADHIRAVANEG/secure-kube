# SecureKube ClusterSecretStore Configuration
# Integrates External Secrets Operator with external vault engines.
#
# Production configurations provided for:
#   1. Local Testing / Development (InMemory / Fake provider)
#   2. HashiCorp Vault (Kubernetes auth method)
#   3. AWS Secrets Manager (IRSA - IAM Roles for Service Accounts)
#   4. GCP Secret Manager (Workload Identity)
#   5. Azure Key Vault (Workload Identity)

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: securekube-vault-store
spec:
  provider:
    # ── Default Local Provider: Built-in Mock / Test Secrets ───────
    # Emulates production secret stores locally without external cloud dependencies.
    fake:
      data:
        - key: "/database/credentials/username"
          value: "vault_db_admin"
        - key: "/database/credentials/password"
          value: "super_secret_vault_password_xyz123"
        - key: "/database/credentials/dbname"
          value: "production_zero_trust_db"

---

# SecureKube ExternalSecret Custom Resource
# Automatically synchronizes secrets from external vaults (HashiCorp Vault / AWS / GCP)
# into native Kubernetes Secrets without requiring developers to handle encryption keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials-vault
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: securekube-vault-store
    kind: ClusterSecretStore
  target:
    name: database-credentials-vault
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: "/database/credentials/username"
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "/database/credentials/password"
    - secretKey: DB_NAME
      remoteRef:
        key: "/database/credentials/dbname"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bannerBg" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filter for Cyber Glow -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1280" height="360" rx="20" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="210" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#cyberGlow)" />
  <circle cx="750" cy="180" r="220" fill="#8b5cf6" opacity="0.08" filter="url(#cyberGlow)" />

  <!-- Grid Tech Lines (Left/Right) -->
  <line x1="0" y1="90" x2="1280" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 16" opacity="0.4" />
  <line x1="0" y1="270" x2="1280" y2="270" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 16" opacity="0.4" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LEFT: SHIELD & KUBERNETES WHEEL EMBLEM                           -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(40, 20) scale(0.65)">
    <!-- Outer Shield -->
    <path d="M 256 40 
             L 410 95 
             C 410 260 348 382 256 446 
             C 164 382 102 260 102 95 
             Z" 
          fill="#0f172a" 
          fill-opacity="0.9" 
          stroke="url(#shieldGrad)" 
          stroke-width="7" 
          stroke-linejoin="round"
          filter="url(#cyberGlow)" />

    <!-- Inner Shield Inset -->
    <path d="M 256 75 
             L 380 118 
             C 380 250 330 350 256 405 
             C 182 350 132 250 132 118 
             Z" 
          fill="none" 
          stroke="#334155" 
          stroke-width="2" 
          stroke-dasharray="6 8" />

    <!-- Center Hub & 7 Spokes -->
    <circle cx="256" cy="235" r="72" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4" filter="url(#cyberGlow)" />
    <circle cx="256" cy="235" r="44" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="256" cy="235" r="22" fill="url(#emeraldGrad)" />
    <circle cx="256" cy="235" r="10" fill="#ffffff" />

    <!-- 7 Spokes -->
    <g transform="translate(256, 235)">
      <g transform="rotate(0)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#00f2fe" filter="url(#cyberGlow)" /></g>
      <g transform="rotate(51.43)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#38bdf8" filter="url(#cyberGlow)" /></g>
      <g transform="rotate(102.86)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#818cf8" filter="url(#cyberGlow)" /></g>
      <g transform="rotate(154.29)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#a78bfa" filter="url(#cyberGlow)" /></g>
      <g transform="rotate(205.71)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#a78bfa" filter="url(#cyberGlow)" /></g>
      <g transform="rotate(257.14)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#818cf8" filter="url(#cyberGlow)" /></g>
      <g transform="rotate(308.57)"><line x1="0" y1="-44" x2="0" y2="-106" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="-110" r="10" fill="#38bdf8" filter="url(#cyberGlow)" /></g>
    </g>

    <!-- Outer Rim Ring -->
    <circle cx="256" cy="235" r="106" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-dasharray="14 10" />

    <!-- Checkmark Badge -->
    <path d="M 234 400 L 250 416 L 278 388" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyberGlow)" />
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: BRAND TYPOGRAPHY & VALUE PROPOSITIONS                    -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(380, 0)">
    <!-- Primary Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="url(#textGrad)">
      Secure<tspan fill="#00f2fe">Kube</tspan>
    </text>

    <!-- Verified Security Tag -->
    <rect x="425" y="80" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="442" cy="94" r="5" fill="#10b981" />
    <text x="454" y="99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="0.5">
      CIS HARDENED
    </text>

    <!-- Subtitle / Elevator Pitch -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="21" fill="#94a3b8" letter-spacing="-0.2">
      Enterprise Zero-Trust Kubernetes Blueprint &amp; Active eBPF Defense
    </text>

    <!-- Feature Pillars / Badges Container -->
    <g transform="translate(0, 208)">
      <!-- Badge 1: 7 Defense Layers -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="70" y="22" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" fill="#a5b4fc" text-anchor="middle">🛡️ 7 Defense Layers</text>
      </g>

      <!-- Badge 2: Calico Zero-Trust -->
      <g transform="translate(152, 0)">
        <rect width="156" height="34" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <text x="78" y="22" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" fill="#7dd3fc" text-anchor="middle">🔒 Zero-Trust CNI</text>
      </g>

      <!-- Badge 3: Falco Talon Active Response -->
      <g transform="translate(320, 0)">
        <rect width="180" height="34" rx="8" fill="#3b0764" stroke="#9333ea" stroke-width="1" />
        <text x="90" y="22" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" fill="#d8b4fe" text-anchor="middle">⚡ Falco Talon eBPF</text>
      </g>

      <!-- Badge 4: In-Tree CEL -->
      <g transform="translate(512, 0)">
        <rect width="140" height="34" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
        <text x="70" y="22" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" fill="#6ee7b7" text-anchor="middle">⚡ In-Tree CEL</text>
      </g>

      <!-- Badge 5: SLSA Level 3 -->
      <g transform="translate(664, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
        <text x="80" y="22" font-family="-apple-system, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" text-anchor="middle">📜 SLSA Level 3</text>
      </g>
    </g>

    <!-- Bottom Terminal One-Liner Hint -->
    <g transform="translate(0, 275)">
      <rect width="520" height="36" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#38bdf8">
        $ <tspan fill="#f1f5f9">docker run --rm -it -v /var/run/docker.sock:... make deploy</tspan>
      </text>
    </g>
  </g>
</svg>

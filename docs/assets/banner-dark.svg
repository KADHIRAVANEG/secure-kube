<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <!-- Hard Neon Lime Drop Shadow for the entire container -->
  <rect x="14" y="14" width="816" height="196" rx="16" fill="#A3E635" />
  <!-- Dark Brutalist Container Canvas -->
  <rect x="6" y="6" width="816" height="196" rx="16" fill="#0B0F19" stroke="#1E293B" stroke-width="3" />

  <!-- Grid Dots Accent in Background -->
  <defs>
    <pattern id="brutalGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" />
    </pattern>
  </defs>
  <rect x="8" y="8" width="812" height="192" rx="14" fill="url(#brutalGrid)" opacity="0.4" />

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEFT: CYBER-BRUTALIST BADGE (Rotated -1.5 deg)                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(32, 28) rotate(-1.5)">
    <!-- Hard Cyan Shadow -->
    <rect x="6" y="6" width="144" height="144" rx="16" fill="#00F0FF" />
    <!-- Dark Card with Neon Lime Border -->
    <rect x="0" y="0" width="144" height="144" rx="16" fill="#020617" stroke="#A3E635" stroke-width="4" />

    <!-- Shield Hard Shadow -->
    <path d="M 74 20 L 116 34 C 116 80 100 110 74 126 C 48 110 32 80 32 34 Z" fill="#00F0FF" />
    <!-- Shield Body: Pitch Black + Acid Lime Stroke -->
    <path d="M 72 18 L 114 32 C 114 78 98 108 72 124 C 46 108 30 78 30 32 Z" fill="#0F172A" stroke="#A3E635" stroke-width="3.5" />

    <!-- Helm Wheel & 7 Radial Spokes -->
    <circle cx="72" cy="68" r="24" fill="none" stroke="#A3E635" stroke-width="3.5" />
    <circle cx="72" cy="68" r="10" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    
    <!-- 7 Spokes -->
    <line x1="72" y1="44" x2="72" y2="34" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="72" cy="34" r="3.5" fill="#FFE600" />

    <line x1="91" y1="53" x2="99" y2="46" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="99" cy="46" r="3.5" fill="#FFE600" />

    <line x1="95" y1="76" x2="105" y2="80" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="105" cy="80" r="3.5" fill="#FFE600" />

    <line x1="82" y1="91" x2="86" y2="100" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="86" cy="100" r="3.5" fill="#FFE600" />

    <line x1="62" y1="91" x2="58" y2="100" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="58" cy="100" r="3.5" fill="#FFE600" />

    <line x1="49" y1="76" x2="39" y2="80" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="39" cy="80" r="3.5" fill="#FFE600" />

    <line x1="53" y1="53" x2="45" y2="46" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <circle cx="45" cy="46" r="3.5" fill="#FFE600" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: CYBER-BRUTALIST TYPOGRAPHY & PILLS                       -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Top Monospace Status Pill -->
  <g transform="translate(205, 24)">
    <rect x="3" y="3" width="220" height="24" rx="4" fill="#A3E635" />
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#020617" stroke="#A3E635" stroke-width="2" />
    <text x="110" y="16.5" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="11" fill="#A3E635" text-anchor="middle" letter-spacing="1">
      [ STATUS: DEFENSE_ACTIVE ]
    </text>
  </g>

  <!-- Title: SECUREKUBE in Chiseled Brutalist Typography -->
  <!-- Offset Shadow in Acid Lime -->
  <text x="209" y="86" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="46" fill="#A3E635" letter-spacing="-1">
    SECURE<tspan fill="#00F0FF">KUBE</tspan>
  </text>
  <!-- Foreground in Crisp White / Cyan -->
  <text x="205" y="82" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="-1">
    SECURE<tspan fill="#00F0FF">KUBE</tspan>
  </text>

  <!-- Subtitle with Terminal Prefix -->
  <g transform="translate(205, 96)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-weight="700" font-size="13.5" fill="#94A3B8" letter-spacing="0.2">
      <tspan fill="#A3E635">&gt; </tspan>ZERO-TRUST KUBERNETES BLUEPRINT &amp; ACTIVE eBPF RESPONSE
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CYBER-BRUTALIST TACTILE STICKERS                                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Sticker 1: CIS Benchmark (Neon Lime) -->
  <g transform="translate(205, 134) rotate(-0.5)">
    <rect x="3" y="3" width="138" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="138" height="34" rx="6" fill="#A3E635" stroke="#FFFFFF" stroke-width="2" />
    <text x="69" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      🛡️ CIS 1.30
    </text>
  </g>

  <!-- Sticker 2: Falco Talon (Hot Pink) -->
  <g transform="translate(356, 134) rotate(0.8)">
    <rect x="3" y="3" width="144" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="144" height="34" rx="6" fill="#FF2E93" stroke="#FFFFFF" stroke-width="2" />
    <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">
      ⚡ FALCO TALON
    </text>
  </g>

  <!-- Sticker 3: SLSA Level 3 (Electric Cyan) -->
  <g transform="translate(512, 134) rotate(-0.8)">
    <rect x="3" y="3" width="140" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="34" rx="6" fill="#00F0FF" stroke="#FFFFFF" stroke-width="2" />
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      🔒 SLSA LEVEL 3
    </text>
  </g>

  <!-- Sticker 4: 100% Local (Canary Yellow) -->
  <g transform="translate(664, 134) rotate(0.5)">
    <rect x="3" y="3" width="132" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="132" height="34" rx="6" fill="#FFE600" stroke="#FFFFFF" stroke-width="2" />
    <text x="66" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      💻 100% LOCAL
    </text>
  </g>
</svg>
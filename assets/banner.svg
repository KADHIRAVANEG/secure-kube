<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <!-- Hard Drop Shadow for entire banner -->
  <rect x="12" y="12" width="816" height="196" rx="16" fill="#000000" />
  <!-- Main Banner Container: Cream White Canvas with Heavy 4px Black Border -->
  <rect x="6" y="6" width="816" height="196" rx="16" fill="#FFFDF5" stroke="#000000" stroke-width="4" />

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEFT: NEO-BRUTALIST APP ICON STICKER (Rotated -1.5 deg)         -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(32, 28) rotate(-1.5)">
    <!-- Icon Hard Shadow -->
    <rect x="8" y="8" width="144" height="144" rx="20" fill="#000000" />
    <!-- Icon Box: Canary Yellow + Heavy 4px Black Border -->
    <rect x="0" y="0" width="144" height="144" rx="20" fill="#FFE600" stroke="#000000" stroke-width="4" />

    <!-- Mini Shield Hard Shadow -->
    <path d="M 74 20 L 116 34 C 116 80 100 110 74 126 C 48 110 32 80 32 34 Z" fill="#000000" />
    <!-- Mini Shield Body: Electric Violet -->
    <path d="M 72 18 L 114 32 C 114 78 98 108 72 124 C 46 108 30 78 30 32 Z" fill="#7C3AED" stroke="#000000" stroke-width="3.5" />

    <!-- Mini Helm Spokes & Hub -->
    <circle cx="72" cy="68" r="24" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="72" cy="68" r="10" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <!-- 7 Spokes -->
    <line x1="72" y1="44" x2="72" y2="34" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="72" y1="44" x2="72" y2="34" stroke="#A3E635" stroke-width="2" stroke-linecap="round" />
    <circle cx="72" cy="34" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />

    <line x1="91" y1="53" x2="99" y2="46" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="99" cy="46" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />

    <line x1="95" y1="76" x2="105" y2="80" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="105" cy="80" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />

    <line x1="82" y1="91" x2="86" y2="100" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="86" cy="100" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />

    <line x1="62" y1="91" x2="58" y2="100" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="58" cy="100" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />

    <line x1="49" y1="76" x2="39" y2="80" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="39" cy="80" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />

    <line x1="53" y1="53" x2="45" y2="46" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <circle cx="45" cy="46" r="3.5" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: NEO-BRUTALIST TYPOGRAPHY & STICKERS                      -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  
  <!-- Monospace Version Tag (Top Pill) -->
  <g transform="translate(205, 26)">
    <rect x="3" y="3" width="170" height="24" rx="4" fill="#000000" />
    <rect x="0" y="0" width="170" height="24" rx="4" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="85" y="17" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle" letter-spacing="1">
      ★ v1.6.0 STABLE ★
    </text>
  </g>

  <!-- Big Bold Neo-Brutalist Title: SECUREKUBE -->
  <!-- Title Hard Black Shadow -->
  <text x="209" y="87" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="46" fill="#000000" letter-spacing="-1">
    SECURE<tspan fill="#000000">KUBE</tspan>
  </text>
  <!-- Title Foreground -->
  <text x="205" y="83" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="46" fill="#121212" letter-spacing="-1">
    SECURE<tspan fill="#7C3AED">KUBE</tspan>
  </text>

  <!-- Subtitle with Highlighter Underline Style -->
  <g transform="translate(205, 96)">
    <rect x="0" y="0" width="480" height="22" fill="#FFE600" />
    <text x="6" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13.5" fill="#000000" letter-spacing="0.2">
      ZERO-TRUST KUBERNETES BLUEPRINT &amp; ACTIVE eBPF DEFENSE
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- NEO-BRUTALIST STICKER ROW (Chunky Badges with Hard Shadows)    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Sticker 1: CIS Benchmark (Acid Green) -->
  <g transform="translate(205, 134) rotate(-0.5)">
    <rect x="4" y="4" width="138" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="138" height="34" rx="6" fill="#A3E635" stroke="#000000" stroke-width="2.5" />
    <text x="69" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      🛡️ CIS 1.30
    </text>
  </g>

  <!-- Sticker 2: Falco Talon (Electric Purple) -->
  <g transform="translate(356, 134) rotate(0.8)">
    <rect x="4" y="4" width="144" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="144" height="34" rx="6" fill="#DDD6FE" stroke="#000000" stroke-width="2.5" />
    <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      ⚡ FALCO TALON
    </text>
  </g>

  <!-- Sticker 3: SLSA Level 3 (Electric Cyan) -->
  <g transform="translate(512, 134) rotate(-0.8)">
    <rect x="4" y="4" width="140" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="34" rx="6" fill="#BAE6FD" stroke="#000000" stroke-width="2.5" />
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      🔒 SLSA LEVEL 3
    </text>
  </g>

  <!-- Sticker 4: 100% Local (Canary Yellow) -->
  <g transform="translate(664, 134) rotate(0.5)">
    <rect x="4" y="4" width="132" height="34" rx="6" fill="#000000" />
    <rect x="0" y="0" width="132" height="34" rx="6" fill="#FEF08A" stroke="#000000" stroke-width="2.5" />
    <text x="66" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      💻 100% LOCAL
    </text>
  </g>
</svg>
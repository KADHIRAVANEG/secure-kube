<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <!-- Hard Blue Offset Shadow for Canvas -->
  <rect x="14" y="14" width="816" height="196" rx="16" fill="#2563EB" />
  <!-- Pitch Black Canvas with 4px Cream Border -->
  <rect x="6" y="6" width="816" height="196" rx="16" fill="#000000" stroke="#FDFBF7" stroke-width="3.5" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LEFT: LOGO EMBLEM BADGE                                          -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- Badge Hard Red Shadow -->
  <rect x="40" y="46" width="140" height="140" rx="14" fill="#DC2626" />
  <!-- Badge Box: Blue Fill with Cream Border -->
  <rect x="34" y="40" width="140" height="140" rx="14" fill="#2563EB" stroke="#FDFBF7" stroke-width="3" />

  <!-- Protective Shield Silhouette (Black with Cream Border) -->
  <path d="M 104.0 58.0 
           L 146.0 74.0 
           C 146.0 122.0 132.0 152.0 104.0 164.0 
           C 76.0 152.0 62.0 122.0 62.0 74.0 
           Z" 
        fill="#000000" 
        stroke="#FDFBF7" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Helm Ring (Cream) -->
  <circle cx="104.0" cy="110.0" r="42" fill="none" stroke="#FDFBF7" stroke-width="4" />

  <!-- 7 Radial Spokes -->
  <line x1="104.0" y1="90.0" x2="104.0" y2="56.0" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />
      <line x1="119.6" y1="97.5" x2="146.2" y2="76.3" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />
      <line x1="123.5" y1="114.5" x2="156.6" y2="122.0" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />
      <line x1="112.7" y1="128.0" x2="127.4" y2="158.7" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />
      <line x1="95.3" y1="128.0" x2="80.6" y2="158.7" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />
      <line x1="84.5" y1="114.5" x2="51.4" y2="122.0" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />
      <line x1="88.4" y1="97.5" x2="61.8" y2="76.3" stroke="#FDFBF7" stroke-width="4.5" stroke-linecap="round" />

  <!-- 7 Red Handle Nodes -->
  <circle cx="104.0" cy="56.0" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
      <circle cx="146.2" cy="76.3" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
      <circle cx="156.6" cy="122.0" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
      <circle cx="127.4" cy="158.7" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
      <circle cx="80.6" cy="158.7" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
      <circle cx="51.4" cy="122.0" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
      <circle cx="61.8" cy="76.3" r="5.5" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />

  <!-- Center Hub: Red Fill with Cream Border -->
  <circle cx="104.0" cy="110.0" r="20" fill="#DC2626" stroke="#FDFBF7" stroke-width="3" />

  <!-- Center Padlock Icon (Cream) -->
  <path d="M 99.0 108.0 V 103.0 C 99.0 99.0 109.0 99.0 109.0 108.0 V 108.0" 
        fill="none" stroke="#FDFBF7" stroke-width="2.5" stroke-linecap="round" />
  <rect x="97.0" y="108.0" width="14" height="11" rx="2" fill="#FDFBF7" />
  <circle cx="104.0" cy="113.0" r="1.5" fill="#000000" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: CLEAN TYPOGRAPHY & ALIGNED STATUS BADGES                 -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Top Status Pill: Red Background with Cream Text -->
  <g transform="translate(204, 30)">
    <rect x="3" y="3" width="168" height="24" rx="4" fill="#2563EB" />
    <rect x="0" y="0" width="168" height="24" rx="4" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
    <text x="84" y="16.5" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="11" fill="#FDFBF7" text-anchor="middle" letter-spacing="1">
      ★ ZERO-TRUST v1.6 ★
    </text>
  </g>

  <!-- Title: SECURE in Cream, KUBE in Blue -->
  <text x="207" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" font-weight="900" font-size="44" fill="#DC2626" letter-spacing="-1">
    SECURE<tspan fill="#DC2626">KUBE</tspan>
  </text>
  <text x="204" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" font-weight="900" font-size="44" fill="#FDFBF7" letter-spacing="-1">
    SECURE<tspan fill="#2563EB">KUBE</tspan>
  </text>

  <!-- Subtitle -->
  <text x="205" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="700" font-size="13.5" fill="#FDFBF7" letter-spacing="0.2">
    ENTERPRISE HARDENED KUBERNETES • ACTIVE eBPF DEFENSE • 100% LOCAL
  </text>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM PILLS ROW (Aligned at y=144)                             -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Pill 1: CIS 1.30 -->
  <g transform="translate(204, 144)">
    <rect x="3" y="3" width="140" height="34" rx="6" fill="#2563EB" />
    <rect x="0" y="0" width="140" height="34" rx="6" fill="#FDFBF7" stroke="#000000" stroke-width="2" />
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      🛡️ CIS 1.30
    </text>
  </g>

  <!-- Pill 2: Falco Talon -->
  <g transform="translate(356, 144)">
    <rect x="3" y="3" width="146" height="34" rx="6" fill="#2563EB" />
    <rect x="0" y="0" width="146" height="34" rx="6" fill="#DC2626" stroke="#FDFBF7" stroke-width="2" />
    <text x="73" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#FDFBF7" text-anchor="middle">
      ⚡ FALCO TALON
    </text>
  </g>

  <!-- Pill 3: SLSA Level 3 -->
  <g transform="translate(514, 144)">
    <rect x="3" y="3" width="142" height="34" rx="6" fill="#DC2626" />
    <rect x="0" y="0" width="142" height="34" rx="6" fill="#2563EB" stroke="#FDFBF7" stroke-width="2" />
    <text x="71" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#FDFBF7" text-anchor="middle">
      🔒 SLSA LEVEL 3
    </text>
  </g>

  <!-- Pill 4: 100% Local -->
  <g transform="translate(668, 144)">
    <rect x="3" y="3" width="134" height="34" rx="6" fill="#DC2626" />
    <rect x="0" y="0" width="134" height="34" rx="6" fill="#FDFBF7" stroke="#000000" stroke-width="2" />
    <text x="67" y="22" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      💻 100% LOCAL
    </text>
  </g>
</svg>
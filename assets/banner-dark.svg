<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <!-- Hard Black Offset Drop Shadow for Canvas -->
  <rect x="14" y="14" width="816" height="196" rx="16" fill="#18181B" />
  <!-- Cream Base Canvas with Thick 4px Black Border -->
  <rect x="6" y="6" width="816" height="196" rx="16" fill="#FAF6EE" stroke="#18181B" stroke-width="4" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LEFT: LOGO EMBLEM BADGE                                          -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- Badge Hard Shadow -->
  <rect x="42" y="44" width="144" height="144" rx="14" fill="#18181B" />
  <!-- Badge Box: Blue Fill with 3.5px Black Border -->
  <rect x="36" y="38" width="144" height="144" rx="14" fill="#2563EB" stroke="#18181B" stroke-width="3.5" />

  <!-- Protective Shield Silhouette (Cream with Black Border) -->
  <path d="M 108.0 58.0 
           L 150.0 74.0 
           C 150.0 122.0 136.0 152.0 108.0 164.0 
           C 80.0 152.0 66.0 122.0 66.0 74.0 
           Z" 
        fill="#FAF6EE" 
        stroke="#18181B" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Helm Ring (Black) -->
  <circle cx="108.0" cy="110.0" r="42" fill="none" stroke="#18181B" stroke-width="4" />

  <!-- 7 Radial Spokes -->
  <line x1="108.0" y1="90.0" x2="108.0" y2="56.0" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
      <line x1="123.6" y1="97.5" x2="150.2" y2="76.3" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
      <line x1="127.5" y1="114.5" x2="160.6" y2="122.0" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
      <line x1="116.7" y1="128.0" x2="131.4" y2="158.7" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
      <line x1="99.3" y1="128.0" x2="84.6" y2="158.7" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
      <line x1="88.5" y1="114.5" x2="55.4" y2="122.0" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
      <line x1="92.4" y1="97.5" x2="65.8" y2="76.3" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />

  <!-- 7 Red Handle Nodes -->
  <circle cx="108.0" cy="56.0" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />
      <circle cx="150.2" cy="76.3" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />
      <circle cx="160.6" cy="122.0" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />
      <circle cx="131.4" cy="158.7" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />
      <circle cx="84.6" cy="158.7" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />
      <circle cx="55.4" cy="122.0" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />
      <circle cx="65.8" cy="76.3" r="5.5" fill="#D9534F" stroke="#18181B" stroke-width="2" />

  <!-- Center Hub: Soft Red Fill with Black Border -->
  <circle cx="108.0" cy="110.0" r="20" fill="#D9534F" stroke="#18181B" stroke-width="3" />

  <!-- Center Padlock Icon (Cream Fill / Black Stroke) -->
  <path d="M 103.0 108.0 V 103.0 C 103.0 99.0 113.0 99.0 113.0 108.0 V 108.0" 
        fill="none" stroke="#FAF6EE" stroke-width="2.5" stroke-linecap="round" />
  <rect x="101.0" y="108.0" width="14" height="11" rx="2" fill="#FAF6EE" stroke="#18181B" stroke-width="1.5" />
  <circle cx="108.0" cy="113.0" r="1.5" fill="#18181B" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: CLEAN TYPOGRAPHY & ALIGNED STATUS BADGES                 -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Top Status Pill: Soft Red Background with Cream Text -->
  <g transform="translate(208, 30)">
    <rect x="3" y="3" width="168" height="24" rx="4" fill="#18181B" />
    <rect x="0" y="0" width="168" height="24" rx="4" fill="#D9534F" stroke="#18181B" stroke-width="2.5" />
    <text x="84" y="16.5" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="11" fill="#FAF6EE" text-anchor="middle" letter-spacing="1">
      ★ ZERO-TRUST v1.6 ★
    </text>
  </g>

  <!-- Big Bold Neo-Brutalist Title: SECURE in Black, KUBE in Blue -->
  <text x="211" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" font-weight="900" font-size="44" fill="#18181B" letter-spacing="-1">
    SECURE<tspan fill="#18181B">KUBE</tspan>
  </text>
  <text x="208" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif" font-weight="900" font-size="44" fill="#18181B" letter-spacing="-1">
    SECURE<tspan fill="#2563EB">KUBE</tspan>
  </text>

  <!-- Subtitle (Clean & Legible) -->
  <text x="209" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="700" font-size="13.5" fill="#18181B" letter-spacing="0.2">
    ENTERPRISE HARDENED KUBERNETES • ACTIVE eBPF DEFENSE • 100% LOCAL
  </text>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM PILLS ROW (Aligned at y=144, 4-color palette only)       -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Pill 1: CIS 1.30 (Blue fill, Cream text) -->
  <g transform="translate(208, 144)">
    <rect x="3" y="3" width="138" height="34" rx="6" fill="#18181B" />
    <rect x="0" y="0" width="138" height="34" rx="6" fill="#2563EB" stroke="#18181B" stroke-width="2.5" />
    <text x="69" y="22" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#FAF6EE" text-anchor="middle">
      🛡️ CIS 1.30
    </text>
  </g>

  <!-- Pill 2: Falco Talon (Soft Red fill, Cream text) -->
  <g transform="translate(358, 144)">
    <rect x="3" y="3" width="146" height="34" rx="6" fill="#18181B" />
    <rect x="0" y="0" width="146" height="34" rx="6" fill="#D9534F" stroke="#18181B" stroke-width="2.5" />
    <text x="73" y="22" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#FAF6EE" text-anchor="middle">
      ⚡ FALCO TALON
    </text>
  </g>

  <!-- Pill 3: SLSA Level 3 (Cream fill, Black text) -->
  <g transform="translate(516, 144)">
    <rect x="3" y="3" width="140" height="34" rx="6" fill="#18181B" />
    <rect x="0" y="0" width="140" height="34" rx="6" fill="#FAF6EE" stroke="#18181B" stroke-width="2.5" />
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#18181B" text-anchor="middle">
      🔒 SLSA LEVEL 3
    </text>
  </g>

  <!-- Pill 4: 100% Local (Blue fill, Cream text) -->
  <g transform="translate(668, 144)">
    <rect x="3" y="3" width="134" height="34" rx="6" fill="#18181B" />
    <rect x="0" y="0" width="134" height="34" rx="6" fill="#2563EB" stroke="#18181B" stroke-width="2.5" />
    <text x="67" y="22" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#FAF6EE" text-anchor="middle">
      💻 100% LOCAL
    </text>
  </g>
</svg>
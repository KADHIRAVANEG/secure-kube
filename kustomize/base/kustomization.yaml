apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pod-security   # namespaces first (others depend on them existing)
  - network-policies
  - rbac

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: securekube
      app.kubernetes.io/managed-by: kustomize

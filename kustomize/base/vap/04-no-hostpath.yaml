# CIS 5.2.10 / NSA-CISA §3.1 — Block HostPath volumes
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: securekube-cel-no-hostpath
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: "[CEL:no-hostpath] Mounting node filesystem via hostPath is forbidden. Remediation: use emptyDir or PersistentVolumeClaims."

# NSA/CISA Hardening Guide §5 — Supply-Chain Registry Allow-List
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: securekube-cel-allowed-registries
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |
        !has(object.spec.containers) || object.spec.containers.all(c,
          c.image.startsWith("docker.io/library/") ||
          c.image.startsWith("ghcr.io/") ||
          c.image.startsWith("gcr.io/") ||
          c.image.startsWith("registry.k8s.io/")
        )
      message: "[CEL:allowed-registries] Images must originate from trusted registries (docker.io/library/, ghcr.io/, gcr.io/, registry.k8s.io/)."

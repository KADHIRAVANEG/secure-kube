# CIS 5.2.4-5.2.6 — Block hostNetwork, hostPID, hostIPC
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: securekube-cel-no-host-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "[CEL:no-hostnetwork] hostNetwork: true is forbidden. Pods must run inside isolated network namespaces."
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: "[CEL:no-hostpid] hostPID: true is forbidden. Pods cannot inspect node host processes."
    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC == false"
      message: "[CEL:no-hostipc] hostIPC: true is forbidden."

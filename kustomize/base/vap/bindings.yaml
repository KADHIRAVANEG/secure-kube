# ValidatingAdmissionPolicyBindings linking SecureKube CEL policies cluster-wide
# System namespaces (kube-system, gatekeeper-system, falco, argocd, monitoring, local-path-storage)
# are excluded so critical infrastructure operators function without interference.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: securekube-binding-no-privileged
spec:
  policyName: securekube-cel-no-privileged
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "gatekeeper-system", "falco", "argocd", "monitoring", "local-path-storage", "external-secrets"]
---

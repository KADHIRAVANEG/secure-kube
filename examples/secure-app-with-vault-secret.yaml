# Reference Pod mounting secrets synchronized by External Secrets Operator (ESO)
# from HashiCorp Vault / AWS Secrets Manager / GCP Secret Manager.
# Adheres 100% to Pod Security Standards (Restricted) and OPA Gatekeeper / CEL policies.
apiVersion: v1
kind: Pod
metadata:
  name: secure-app-with-vault-secret
  namespace: default
  labels:
    app: secure-app-with-vault-secret
spec:
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: docker.io/library/nginx:1.27-alpine
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=========================================================="
          echo "   SecureKube Workload Running with Vault Synchronized Secret"
          echo "=========================================================="
          echo "DB_USER:     ${DB_USER}"
          echo "DB_NAME:     ${DB_NAME}"
          echo "DB_PASSWORD: [PROTECTED - LENGTH: ${#DB_PASSWORD} CHARS]"
          echo "=========================================================="
          sleep 3600

      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials-vault
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials-vault
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-credentials-vault
              key: DB_NAME

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
